name: Deploy

on:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# gh-pagesブランチへcommitを積むため、GITHUB_TOKENにcontents書き込み権限が必要
# （PRごとのE2Eレポート公開（frontend.yml）と同じブランチ・同じ公開サイトを共有するため、
#  GitHub Actions公式のPagesデプロイ方式ではなく、gh-pagesブランチへの直接publishに統一している）
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/pwa
          # reports/配下（PRごとのPlaywrightレポート、frontend.ymlが管理）を消さないよう保持する
          keep_files: true
